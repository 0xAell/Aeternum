name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  readme-signature:
    name: README signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Neon 4 credit
        run: |
          if ! grep -Fxq '<sub>README by Neon 4</sub>' README.md; then
            echo "::error file=README.md::Restore the README by Neon 4 signature in the footer."
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install LuaJIT and luacheck
        run: sudo apt-get update && sudo apt-get install -y luajit lua-check zip
      - name: Lint
        run: luacheck .
      - name: Test
        run: luajit tests/run.lua
      - name: Check bundled data
        run: tools/check_data.sh "$RUNNER_TEMP/norgannondb"
      - name: Package and verify license notices
        run: |
          touch "licenses/local copy 2.txt"
          archive=$(tools/package.sh)
          diff -u <(git ls-files licenses | sort) \
            <(unzip -Z1 "$archive" | sed -n 's|^Aeternum/\(licenses/..*\)$|\1|p' | sort)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Aeternum
          path: dist/*.zip
